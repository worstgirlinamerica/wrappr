name: GitHub Clone Count Daily

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: gh login
        run: echo "${{ secrets.SECRET_TOKEN }}" | gh auth login --with-token

      - name: get current clones
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.SECRET_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/traffic/clones \
            > current.json
          echo "Current clones:"
          cat current.json

      - name: get previous count from gist
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.SECRET_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/gists/${{ secrets.GIST_ID }}" \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          content = data['files']['clone.json']['content']
          print(content)
          " > previous.json
          echo "Previous count:"
          cat previous.json

      - name: update count
        run: |
          python3 - <<'EOF'
          import json

          with open('current.json') as f:
              current = json.load(f)

          with open('previous.json') as f:
              previous = json.load(f)

          prev_count = previous.get('count', 70)
          prev_unique = previous.get('unique', 47)

          new_count = prev_count + current.get('count', 0)
          new_unique = prev_unique + current.get('uniques', 0)

          result = {'count': new_count, 'unique': new_unique}
          print('New totals:', result)

          with open('clone.json', 'w') as f:
              json.dump(result, f)
          EOF

      - name: push to gist
        run: |
          content=$(python3 -c "import json; print(json.dumps(json.load(open('clone.json'))))")
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.SECRET_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/gists/${{ secrets.GIST_ID }}" \
            -d "{\"files\":{\"clone.json\":{\"content\":\"$content\"}}}"
