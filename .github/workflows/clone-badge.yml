name: GitHub Clone Count Daily

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: gh login
        run: echo "${{ secrets.SECRET_TOKEN }}" | gh auth login --with-token

      - name: get current clones
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.SECRET_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/traffic/clones \
            > current.json
          echo "current:" && cat current.json

      - name: get previous count from gist
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.SECRET_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/gists/f2a55856d3621bfe2e1ae3aa56a4a297" \
            > gist_response.json
          echo "gist response:" && cat gist_response.json
          python3 -c "
          import json
          with open('gist_response.json') as f:
              data = json.load(f)
          content = data['files']['clone.json']['content']
          with open('previous.json', 'w') as f:
              f.write(content)
          print('previous:', content)
          "

      - name: update count
        run: |
          python3 - <<'EOF'
          import json

          with open('current.json') as f:
              current = json.load(f)

          try:
              with open('previous.json') as f:
                  previous = json.load(f)
              prev_count = previous.get('count', 70)
              prev_unique = previous.get('unique', 47)
          except Exception as e:
              print(f'Could not read previous.json, using defaults: {e}')
              prev_count = 70
              prev_unique = 47

          new_count = prev_count + current.get('count', 0)
          new_unique = prev_unique + current.get('uniques', 0)

          result = {'count': new_count, 'unique': new_unique}
          print('new totals:', result)

          with open('clone.json', 'w') as f:
              json.dump(result, f)
          EOF

      - name: push to gist
        run: |
          content=$(cat clone.json)
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.SECRET_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/gists/f2a55856d3621bfe2e1ae3aa56a4a297" \
            -d "{\"files\":{\"clone.json\":{\"content\":$(python3 -c \"import json,sys; print(json.dumps(open('clone.json').read()))\")}}"
          echo "done"
