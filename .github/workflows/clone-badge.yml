name: GitHub Clone Count Daily

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: gh login
        run: echo "${{ secrets.SECRET_TOKEN }}" | gh auth login --with-token

      - name: get current clones
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.SECRET_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/traffic/clones \
            > current.json
          echo "current:" && cat current.json

      - name: get previous count from gist
        run: |
          curl -s \
            "https://gist.githubusercontent.com/worstgirlinamerica/f2a55856d3621bfe2e1ae3aa56a4a297/raw/clone.json" \
            > previous.json
          echo "previous:" && cat previous.json

      - name: update count
        run: |
          python3 - <<'EOF'
          import json, os
          from datetime import datetime, timezone

          with open('current.json') as f:
              current = json.load(f)

          with open('previous.json') as f:
              previous = json.load(f)

          prev_count = previous.get('count', 70)
          prev_unique = previous.get('unique', 47)
          last_timestamp = previous.get('last_timestamp', None)

          # only count clones newer than last run
          new_count = 0
          new_unique = 0
          latest_timestamp = last_timestamp

          for entry in current.get('clones', []):
              ts = entry['timestamp']
              if last_timestamp is None or ts > last_timestamp:
                  new_count += entry['count']
                  new_unique += entry['uniques']
                  if latest_timestamp is None or ts > latest_timestamp:
                      latest_timestamp = ts

          result = {
              'count': prev_count + new_count,
              'unique': prev_unique + new_unique,
              'last_timestamp': latest_timestamp
          }
          print('new totals:', result)

          with open('clone.json', 'w') as f:
              json.dump(result, f)
          EOF

      - name: push to gist
        run: |
          python3 -c "
          import json, urllib.request
          content = open('clone.json').read()
          data = json.dumps({'files': {'clone.json': {'content': content}}}).encode()
          req = urllib.request.Request(
              'https://api.github.com/gists/f2a55856d3621bfe2e1ae3aa56a4a297',
              data=data,
              method='PATCH'
          )
          req.add_header('Authorization', 'token ${{ secrets.SECRET_TOKEN }}')
          req.add_header('Accept', 'application/vnd.github.v3+json')
          res = urllib.request.urlopen(req)
          print('done:', res.status)
          "
