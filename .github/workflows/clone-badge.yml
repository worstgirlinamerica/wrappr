name: GitHub Clone Count *Daily*

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: gh login
        run: echo "${{ secrets.SECRET_TOKEN }}" | gh auth login --with-token

      - name: parse latest clone count
        run: |
          curl --user "${{ github.actor }}:${{ secrets.SECRET_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/traffic/clones \
            > clone.json

      - name: download previous count from gist
        run: |
          curl -H "Authorization: token ${{ secrets.SECRET_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/gists/${{ secrets.GIST_ID }} \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['files']['clone.json']['content'])" \
            > clone_before.json

      - name: update clone.json
        run: |
          curl https://raw.githubusercontent.com/MShawon/github-clone-count-badge/master/main.py > main.py
          python3 main.py

      - name: update gist with latest count
        run: |
          content=$(cat clone.json | python3 -c "import sys,json; print(json.dumps(json.load(sys.stdin)))")
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.SECRET_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/gists/${{ secrets.GIST_ID }} \
            -d "{\"files\":{\"clone.json\":{\"content\":$(echo $content | python3 -c \"import sys,json; print(json.dumps(sys.stdin.read()))\")}}"
